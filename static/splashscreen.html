<!-- static/splashscreen.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        html {
            background: transparent;
        }

        body {
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 4px;
            margin: 0;
            background-color: transparent;
            color: white;
            font-family: Arial, sans-serif;

            .box {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                border: 2px solid darkorange;
                border-radius: 8px;
            }

            img {
                position: absolute;
                width: 300px;
                height: 450px;
            }

        }
    </style>
</head>
<body>
<div class="box">
    <img src="logo.webp" alt="bg"/>
</div>
</body>
</html>
